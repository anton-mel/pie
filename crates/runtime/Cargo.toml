[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chat-template = { path = "../chat-template" }
grammar = { path = "../grammar" }
serde_json = "1" # NEW
engine = { path = "../engine" }
tokenizers = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
wasmtime = "48"
wasmtime-wasi = "48"
