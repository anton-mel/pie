[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util"] }
wasmtime = "48"
wasmtime-wasi = "48"
