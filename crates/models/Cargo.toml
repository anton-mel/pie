[package]
name = "models"
version = "0.1.0"
edition = "2024"

[features]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-metal-kernels = { version = "0.11", optional = true }
engine = { path = "../engine" }
objc2-metal = { version = "0.3.2", optional = true }
serde_json = "1"
