[package]
name = "client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pie-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
client-api = { path = "../client-api" }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = "0.30"
