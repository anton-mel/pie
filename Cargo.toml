[package]
name = "pie"
version = "0.1.0"
edition = "2024"

[features]
metal = ["models/metal"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.4"
models = { path = "crates/models" }
runtime = { path = "crates/runtime" }
serde_json = "1"
tokenizers = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[workspace]
resolver = "3"
members = [".", "crates/*", "tests/inferlets/*"]
default-members = ["."]

[profile.release]
debug = false
