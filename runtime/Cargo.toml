[package]
name = "pie"
version = "0.1.0"
edition = "2024"

[features]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util"] }
wasmtime = "48"
wasmtime-wasi = "48"
